[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "property-listing-cutouts"
version = "0.1.0"
description = "A typed FastAPI service that removes backgrounds from property listing photos."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
property-cutout = "property_cutouts.listing_cutout:main"

[tool.hatch.build.targets.wheel]
packages = ["src/property_cutouts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
